[project]
name = "rag1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhay S Kulkarni", email = "168974674+Abhay-SKulkarni123@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "ipykernel>=7.3.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.20.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag1 = "rag1:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
